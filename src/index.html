<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="card">
      <header class="editor-header" data-drag-region>
        <span class="editor-title">速记</span>
        <span class="drag-grabber" aria-hidden="true"></span>
        <span id="word-count" class="word-count"></span>
      </header>
      <textarea
        id="note-input"
        placeholder="记点什么…&#10;&#10;Enter 换行，Ctrl+Enter 保存"
        autocomplete="off"
        spellcheck="false"
        autofocus
      ></textarea>
      <footer class="editor-footer">
        <span class="hint">Alt+Q 速记 · Alt+Z 历史 · Esc 收起</span>
        <button id="fullscreen-btn" class="icon-btn" title="全屏 (F11)">⛶</button>
        <button id="save-btn" class="save-btn" title="Ctrl+Enter">保存</button>
      </footer>
      <div id="status" class="status" role="status"></div>
      <!-- 无边框窗口没有系统缩放边框，用自定义 handle 触发原生 resize 拖拽 -->
      <div class="resize-handle resize-e" data-resize="East"></div>
      <div class="resize-handle resize-s" data-resize="South"></div>
      <div class="resize-handle resize-se" data-resize="SouthEast"></div>
    </main>
  </body>
</html>
