<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark 设置</title>
    <script type="module" src="/settings.js" defer></script>
  </head>

  <body>
    <main class="card settings-card">
      <header class="editor-header">
        <span class="editor-title">设置</span>
        <button id="close-btn" class="icon-btn" title="关闭 (Esc)">✕</button>
      </header>

      <div class="settings-body">
        <!-- 通用 -->
        <section class="settings-section">
          <h3 class="settings-h3">通用</h3>

          <div class="settings-row">
            <div class="settings-label">
              <div>开机自启</div>
              <div class="settings-sub" id="autostart-sub"></div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="autostart-toggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="settings-row settings-row-stack">
            <div class="settings-label">
              <div>笔记保存位置</div>
              <div class="settings-sub">所有速记都将追加写入此文件</div>
            </div>
            <div class="settings-path">
              <code id="notes-path" class="settings-path-text" title=""></code>
              <button id="pick-path-btn" class="settings-btn">更改…</button>
              <button id="reset-path-btn" class="settings-btn settings-btn-ghost">重置为默认</button>
            </div>
          </div>
        </section>

        <!-- 快捷键 -->
        <section class="settings-section">
          <h3 class="settings-h3">快捷键</h3>
          <div class="settings-sub settings-restart-hint">
            快捷键修改后需要重启应用生效（Wayland 协议限制）
          </div>

          <div class="settings-row">
            <div class="settings-label">
              <div>唤出速记窗口</div>
              <div class="settings-sub">默认 <code id="hotkey-main-default"></code></div>
            </div>
            <input
              type="text"
              id="hotkey-main"
              class="settings-input"
              placeholder="例如 Ctrl+Alt+Space"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="settings-row">
            <div class="settings-label">
              <div>唤出历史记录</div>
              <div class="settings-sub">默认 <code id="hotkey-history-default"></code></div>
            </div>
            <input
              type="text"
              id="hotkey-history"
              class="settings-input"
              placeholder="例如 Super+H"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </section>

        <div id="settings-status" class="settings-status"></div>
      </div>
    </main>
  </body>
</html>
