<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark 设置</title>
    <script type="module" src="./settings.js"></script>
  </head>

  <body>
    <main class="card settings-card">
      <header class="editor-header" data-drag-region>
        <span class="editor-title">设置</span>
        <span class="drag-grabber" aria-hidden="true"></span>
        <button id="close-btn" class="icon-btn header-close" title="关闭 (Esc)">✕</button>
      </header>

      <div class="settings-body">
        <!-- 通用 -->
        <section class="settings-section">
          <h3 class="settings-h3">通用</h3>

          <div class="settings-row">
            <div class="settings-label">
              <div>开机自启</div>
              <div class="settings-sub" id="autostart-sub"></div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="autostart-toggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="settings-row">
            <div class="settings-label">
              <div>主题</div>
              <div class="settings-sub">跟随系统会随桌面明暗自动切换</div>
            </div>
            <div class="theme-segmented" role="radiogroup" aria-label="主题">
              <button type="button" class="theme-segment" data-theme="light" aria-pressed="false">白天</button>
              <button type="button" class="theme-segment" data-theme="dark" aria-pressed="false">黑夜</button>
              <button type="button" class="theme-segment" data-theme="system" aria-pressed="false">跟随系统</button>
            </div>
          </div>

          <div class="settings-row settings-row-stack">
            <div class="settings-label">
              <div>笔记保存位置</div>
              <div class="settings-sub">所有速记都将追加写入此文件</div>
            </div>
            <div class="settings-path">
              <code id="notes-path" class="settings-path-text" title=""></code>
              <button id="pick-path-btn" class="settings-btn">更改…</button>
              <button id="reset-path-btn" class="settings-btn settings-btn-ghost">重置为默认</button>
            </div>
          </div>
        </section>

        <!-- 数据 -->
        <section class="settings-section">
          <h3 class="settings-h3">数据</h3>

          <div class="settings-row settings-row-stack">
            <div class="settings-label">
              <div>备份与恢复</div>
              <div class="settings-sub">
                导出为 JSONL；导入会与现有笔记合并并去重，写入前保留 .bak
              </div>
            </div>
            <div class="settings-path">
              <button id="export-notes-btn" class="settings-btn">导出备份…</button>
              <button id="import-notes-btn" class="settings-btn settings-btn-ghost">
                导入备份…
              </button>
            </div>
          </div>
        </section>

        <!-- 关于 -->
        <section class="settings-section">
          <h3 class="settings-h3">关于</h3>

          <div class="settings-row">
            <div class="settings-label">
              <div>Spark</div>
              <div class="settings-sub" id="app-version"></div>
            </div>
            <button id="check-update-btn" class="settings-btn">检查更新</button>
          </div>

          <div id="update-result" class="settings-update hidden">
            <div class="settings-update-title" id="update-title"></div>
            <div class="settings-update-notes" id="update-notes"></div>
            <div class="settings-actions" id="update-actions">
              <button id="download-update-btn" class="settings-btn">下载新版</button>
            </div>
          </div>
        </section>

        <!-- 快捷键 -->
        <section class="settings-section">
          <h3 class="settings-h3">快捷键</h3>
          <div class="settings-sub settings-restart-hint">
            点击输入框后直接按下组合键即可录制；<code>Esc</code> 取消，
            <code>Backspace</code> 恢复默认
          </div>

          <div class="settings-row">
            <div class="settings-label">
              <div>唤出速记窗口</div>
              <div class="settings-sub">
                默认 <code id="hotkey-main-default"></code> · 当前
                <code id="hotkey-main-current"></code>
              </div>
            </div>
            <input
              type="text"
              id="hotkey-main"
              class="settings-input hotkey-input"
              placeholder="点击后按键"
              readonly
              inputmode="none"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="settings-row">
            <div class="settings-label">
              <div>唤出历史记录</div>
              <div class="settings-sub">
                默认 <code id="hotkey-history-default"></code> · 当前
                <code id="hotkey-history-current"></code>
              </div>
            </div>
            <input
              type="text"
              id="hotkey-history"
              class="settings-input hotkey-input"
              placeholder="点击后按键"
              readonly
              inputmode="none"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="settings-actions">
            <button id="reset-hotkeys-btn" class="settings-btn settings-btn-ghost">
              恢复默认
            </button>
          </div>
        </section>

        <div id="settings-status" class="settings-status"></div>
      </div>
    </main>
  </body>
</html>
