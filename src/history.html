<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark 历史记录</title>
    <script type="module" src="./history.js"></script>
  </head>

  <body>
    <main class="history-card">
      <header class="history-header" data-drag-region>
        <span id="history-title" class="history-title">历史记录</span>
        <span class="drag-grabber" aria-hidden="true"></span>
        <span id="count" class="history-count"></span>
        <button id="select-btn" class="icon-btn select-toggle" title="多选" tabindex="-1">选择</button>
        <button id="trash-btn" class="icon-btn" title="回收站" tabindex="-1">回收站</button>
        <button id="settings-btn" class="icon-btn" title="设置" tabindex="-1">⚙</button>
        <button id="close-btn" class="icon-btn" title="关闭 (Esc)" tabindex="-1">✕</button>
      </header>
      <div id="search-wrap" class="history-search">
        <input
          id="search-input"
          class="history-search-input"
          type="text"
          placeholder="搜索记录…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div id="filters" class="history-filters" role="group" aria-label="按时间筛选">
        <button class="filter-chip is-active" data-range="all" tabindex="-1">全部</button>
        <button class="filter-chip" data-range="today" tabindex="-1">今天</button>
        <button class="filter-chip" data-range="7d" tabindex="-1">近7天</button>
        <button class="filter-chip" data-range="30d" tabindex="-1">近30天</button>
      </div>
      <div id="note-list" class="history-list"></div>
      <div id="empty" class="history-empty hidden">
        <span class="history-empty-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 3.5h9.5L19 8v12.5H5z" />
            <path d="M14.5 3.5V8H19" />
            <path d="M8.5 12h7M8.5 15.5h4.5" />
          </svg>
        </span>
        <div id="empty-text">
          还没有速记<br /><span class="dim">按 <kbd class="kbd">Alt+Q</kbd> 写下第一条</span>
        </div>
      </div>

      <!-- 编辑态：覆盖整个窗口，体验与速记编辑器一致 -->
      <div id="edit-view" class="edit-view hidden">
        <header class="edit-view-header" data-drag-region>
          <span class="edit-view-title">编辑速记</span>
          <span id="edit-time" class="edit-view-time"></span>
          <span id="edit-count" class="edit-view-count"></span>
        </header>
        <div class="editor-wrap">
          <div id="edit-text" class="cm-host"></div>
        </div>
        <footer class="edit-view-footer">
          <span class="hint">Ctrl+Enter 保存 · Esc 取消</span>
          <button id="edit-cancel" class="settings-btn" tabindex="-1">取消</button>
          <button id="edit-save" class="save-btn" tabindex="-1">保存</button>
        </footer>
      </div>

      <!-- 多选模式底部操作条 -->
      <div id="select-bar" class="history-select-bar hidden">
        <span id="select-count" class="history-select-count">已选 0 条</span>
        <button id="select-copy" class="bar-btn" tabindex="-1">复制原始文本</button>
        <button id="select-export" class="bar-btn" tabindex="-1">导出图片</button>
        <button id="select-delete" class="bar-btn bar-btn-danger" tabindex="-1">删除</button>
        <button id="select-cancel" class="bar-btn" tabindex="-1">取消</button>
      </div>

      <!-- 回收站底部操作条 -->
      <div id="trash-bar" class="history-select-bar hidden">
        <span id="trash-hint" class="history-select-count">回收站保留 30 天</span>
        <button id="trash-empty" class="bar-btn bar-btn-danger" tabindex="-1">清空回收站</button>
      </div>

      <!-- 删除确认：覆盖整个窗口，避免误触直接删除 -->
      <div id="confirm-view" class="confirm-view hidden">
        <div class="confirm-card" role="dialog" aria-modal="true">
          <div id="confirm-title" class="confirm-title"></div>
          <div id="confirm-desc" class="confirm-desc"></div>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="settings-btn" tabindex="-1">取消</button>
            <button id="confirm-ok" class="save-btn" tabindex="-1">确认</button>
          </div>
        </div>
      </div>

      <div id="toast" class="history-toast"></div>
    </main>
  </body>
</html>
