<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark 历史记录</title>
    <script type="module" src="./history.js"></script>
  </head>

  <body>
    <main class="history-card">
      <header class="history-header" data-drag-region>
        <span class="history-title">历史记录</span>
        <span class="drag-grabber" aria-hidden="true"></span>
        <span id="count" class="history-count"></span>
        <button id="settings-btn" class="icon-btn" title="设置" tabindex="-1">⚙</button>
        <button id="close-btn" class="icon-btn" title="关闭 (Esc)" tabindex="-1">✕</button>
      </header>
      <div id="note-list" class="history-list"></div>
      <div id="empty" class="history-empty hidden">
        还没有记录<br /><span class="dim">按 Alt+Q 写下第一条速记</span>
      </div>

      <!-- 编辑态：覆盖整个窗口，体验与速记编辑器一致 -->
      <div id="edit-view" class="edit-view hidden">
        <header class="edit-view-header" data-drag-region>
          <span class="edit-view-title">编辑速记</span>
          <span id="edit-time" class="edit-view-time"></span>
          <span id="edit-count" class="edit-view-count"></span>
        </header>
        <div class="editor-wrap">
          <div id="edit-text" class="cm-host"></div>
        </div>
        <footer class="edit-view-footer">
          <span class="hint">Ctrl+Enter 保存 · Esc 取消</span>
          <button id="edit-cancel" class="settings-btn" tabindex="-1">取消</button>
          <button id="edit-save" class="save-btn" tabindex="-1">保存</button>
        </footer>
      </div>

      <div id="toast" class="history-toast"></div>
    </main>
  </body>
</html>
