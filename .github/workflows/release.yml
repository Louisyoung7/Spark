name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 Linux 安装包
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 npm 依赖
        run: npm ci

      - name: 校验版本号与 tag 一致
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG tauri.conf.json=$CONF package.json=$PKG"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::版本号不一致：tag=$TAG, tauri.conf.json=$CONF, package.json=$PKG"
            exit 1
          fi

      - name: 构建
        run: npm run tauri build

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ || true
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ || true
          ls -lh artifacts

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: spark-linux-x64
          path: artifacts/*
          if-no-files-found: error

  draft-release:
    name: 创建草稿 Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # 后续新增平台时，只需增加 build job 并上传 artifact，
      # 这里会合并所有平台的产物一起附到 Release。
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 / 更新草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
