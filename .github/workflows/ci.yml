name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust 检查（fmt / clippy / check）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

  frontend:
    name: 前端静态检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 语法检查（HTML 引用的资源必须存在）
        run: |
          set -euo pipefail
          for f in src/*.html; do
            echo "检查 $f"
            # 校验 script / link 引用的本地文件是否存在
            grep -oE '(src|href)="/[^"]+"' "$f" \
              | sed -E 's/.*="\/([^"]+)"/\1/' \
              | while read -r asset; do
                  if [ ! -f "src/$asset" ]; then
                    echo "::error file=$f::$f 引用了不存在的资源 /$asset"
                    exit 1
                  fi
                done
          done

      - name: JS 语法检查
        run: |
          set -euo pipefail
          for f in src/*.js; do
            echo "检查 $f"
            node --check "$f"
          done

      - name: 校验 Tauri 配置与权限声明
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            JSON.parse(fs.readFileSync("src-tauri/capabilities/default.json", "utf8"));
            JSON.parse(fs.readFileSync("package.json", "utf8"));
            console.log("JSON 配置解析通过");
          '
