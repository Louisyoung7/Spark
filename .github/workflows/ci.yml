name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust 检查与测试（fmt / clippy / test）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # tauri::generate_context! 编译期需要前端产物，先构建 dist
      - name: 安装 npm 依赖并构建前端
        run: |
          npm ci
          npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 npm 依赖
        run: npm ci

      - name: 语法检查（HTML 引用的资源必须存在）
        run: |
          set -euo pipefail
          for f in src/*.html; do
            echo "检查 $f"
            # 校验 script / link 引用的本地文件是否存在
            # 注意：grep 无匹配会返回 1，需 || true 避免被 set -e / pipefail 误判为失败
            grep -oE '(src|href)="/[^"]+"' "$f" || true \
              | sed -E 's/.*="\/([^"]+)"/\1/' \
              | while read -r asset; do
                  if [ ! -f "src/$asset" ]; then
                    echo "::error file=$f::$f 引用了不存在的资源 /$asset"
                    exit 1
                  fi
                done
          done

      - name: JS 语法检查
        run: |
          set -euo pipefail
          # 递归覆盖 src 下的所有 JS，避免子目录漏检
          find src -type f -name "*.js" -print0 | while IFS= read -r -d '' f; do
            echo "检查 $f"
            node --check "$f"
          done

      - name: ESLint
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 校验版本号一致
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargo = fs
              .readFileSync("src-tauri/Cargo.toml", "utf8")
              .match(/^version\s*=\s*"([^"]+)"/m)[1];
            if (new Set([pkg, tauri, cargo]).size !== 1) {
              console.error(`版本号不一致: package.json=${pkg}, tauri.conf.json=${tauri}, Cargo.toml=${cargo}`);
              process.exit(1);
            }
            console.log(`版本号一致: ${pkg}`);
          '

      - name: 校验 Tauri 配置与权限声明
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            JSON.parse(fs.readFileSync("src-tauri/capabilities/default.json", "utf8"));
            JSON.parse(fs.readFileSync("package.json", "utf8"));
            console.log("JSON 配置解析通过");
          '

      - name: 构建前端
        run: npm run build
